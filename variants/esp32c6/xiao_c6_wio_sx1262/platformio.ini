[env:xiao-c6-wio-sx1262]

custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = XIAO_C6_WIO_SX1262
custom_meshtastic_architecture = esp32-c6
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 0
custom_meshtastic_display_name = XIAO ESP32-C6 + Wio-SX1262
custom_meshtastic_tags = Seeed

extends = esp32c6_base

board = seeed_xiao_esp32c6
board_level = private

build_flags =
  ${esp32c6_base.build_flags}
  -D XIAO_C6_WIO_SX1262
  -I variants/esp32c6/xiao_c6_wio_sx1262
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1

lib_ignore =
  ${esp32c6_base.lib_ignore}
  ESP32 Codec2
